<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSE Value Per Trade (VPT) Tracker</title>
  <!-- Chart.js & PapaParse CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h2 { margin: 8px 0; font-size: 1.2rem; }
    .card {
      background: #1e293b;
      padding: 14px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }
    .chart-container {
      position: relative;
      height: 230px;
      margin-bottom: 16px;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .stat-val { font-weight: 600; color: #38bdf8; }
  </style>
</head>
<body>

  <div class="card">
    <h2>📈 NSE VPT Analyzer</h2>
    <label style="font-size:0.85rem; color:#94a3b8;">Upload NSE Bhavcopy (CSV):</label>
    <input type="file" id="csvFileInput" accept=".csv" multiple />
    <div id="statusText" style="font-size:0.8rem; color:#10b981; margin-top:6px;">Ready</div>
  </div>

  <div class="card">
    <label style="font-size:0.85rem; color:#94a3b8;">Select Stock Symbol:</label>
    <select id="stockSelector">
      <option value="">-- Upload a file first --</option>
    </select>
    <div class="stat-row">
      <span>Latest Close: <span id="latestClose" class="stat-val">-</span></span>
      <span>Latest VPT: <span id="latestVpt" class="stat-val">-</span></span>
    </div>
  </div>

  <div class="card">
    <h3 style="font-size: 0.95rem; margin: 0 0 8px 0; color: #cbd5e1;">Close Price (₹)</h3>
    <div class="chart-container">
      <canvas id="priceChart"></canvas>
    </div>

    <h3 style="font-size: 0.95rem; margin: 0 0 8px 0; color: #cbd5e1;">Value Per Trade (Turnover / Trades)</h3>
    <div class="chart-container">
      <canvas id="vptChart"></canvas>
    </div>
  </div>

  <script>
    // 1. Setup Local IndexedDB for holding historical dates
    let db;
    const request = indexedDB.open("NseVptDB", 1);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      const store = db.createObjectStore("trades", { keyPath: ["symbol", "date"] });
      store.createIndex("symbol", "symbol", { unique: false });
    };
    request.onsuccess = (e) => {
      db = e.target.result;
      loadAvailableSymbols();
    };

    // 2. CSV Ingestion Engine
    document.getElementById("csvFileInput").addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      document.getElementById("statusText").innerText = "Processing files...";

      let completed = 0;
      files.forEach((file) => {
        Papa.parse(file, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            saveToIndexedDB(results.data, () => {
              completed++;
              if (completed === files.length) {
                document.getElementById("statusText").innerText = "All files imported successfully!";
                loadAvailableSymbols();
              }
            });
          }
        });
      });
    });

    function saveToIndexedDB(rows, callback) {
      const tx = db.transaction("trades", "readwrite");
      const store = tx.objectStore("trades");

      rows.forEach(r => {
        // Strip column whitespace
        const clean = {};
        for (let k in r) clean[k.trim()] = (r[k] || "").trim();

        // Target standard NSE columns: sec_bhavdata_full format
        const symbol = clean["SYMBOL"];
        const series = clean["SERIES"];
        const dateStr = clean["DATE1"] || clean["TIMESTAMP"] || clean["TRADING_DATE"];
        const turnover = parseFloat(clean["TOTTRDVAL"]) || 0;
        const trades = parseFloat(clean["TOTALTRADES"]) || 0;
        const close = parseFloat(clean["CLOSE_PRICE"] || clean["CLOSE"]) || 0;

        if (symbol && series === "EQ" && trades > 0 && dateStr) {
          const vpt = turnover / trades;
          store.put({
            symbol: symbol,
            date: dateStr,
            close: close,
            turnover: turnover,
            trades: trades,
            vpt: Math.round(vpt * 100) / 100
          });
        }
      });

      tx.oncomplete = callback;
    }

    // 3. Populate Stocks Dropdown
    function loadAvailableSymbols() {
      const tx = db.transaction("trades", "readonly");
      const store = tx.objectStore("trades");
      const index = store.index("symbol");
      const symbols = new Set();

      index.openKeyCursor().onsuccess = function(e) {
        const cursor = e.target.result;
        if (cursor) {
          symbols.add(cursor.key);
          cursor.continue();
        } else {
          const select = document.getElementById("stockSelector");
          select.innerHTML = '<option value="">-- Choose Stock --</option>';
          Array.from(symbols).sort().forEach(sym => {
            const opt = document.createElement("option");
            opt.value = sym;
            opt.innerText = sym;
            select.appendChild(opt);
          });
        }
      };
    }

    // 4. Chart Rendering
    let priceChartInstance, vptChartInstance;
    document.getElementById("stockSelector").addEventListener("change", (e) => {
      const sym = e.target.value;
      if (!sym) return;

      const tx = db.transaction("trades", "readonly");
      const store = tx.objectStore("trades");
      const index = store.index("symbol");
      const req = index.getAll(sym);

      req.onsuccess = () => {
        const records = req.result.sort((a, b) => new Date(a.date) - new Date(b.date));
        renderCharts(records);
      };
    });

    function renderCharts(data) {
      const labels = data.map(d => d.date);
      const prices = data.map(d => d.close);
      const vpts = data.map(d => d.vpt);

      if (data.length) {
        const last = data[data.length - 1];
        document.getElementById("latestClose").innerText = "₹" + last.close;
        document.getElementById("latestVpt").innerText = "₹" + Number(last.vpt).toLocaleString("en-IN");
      }

      if (priceChartInstance) priceChartInstance.destroy();
      if (vptChartInstance) vptChartInstance.destroy();

      const priceCtx = document.getElementById("priceChart").getContext("2d");
      priceChartInstance = new Chart(priceCtx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Price (₹)",
            data: prices,
            borderColor: "#38bdf8",
            borderWidth: 2,
            tension: 0.2,
            pointRadius: 2
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const vptCtx = document.getElementById("vptChart").getContext("2d");
      vptChartInstance = new Chart(vptCtx, {
        type: "bar",
        data: {
          labels: labels,
          datasets: [{
            label: "VPT (₹)",
            data: vpts,
            backgroundColor: "#818cf8",
            borderRadius: 4
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  </script>
</body>
</html>
